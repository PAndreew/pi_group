name: Deploy interactive demo
on:
  push:
    branches: [main]
  workflow_dispatch:
# Pages serves the gh-pages branch (its github-pages environment only lets that branch deploy), so the
# job publishes the build there instead of deploying an artifact from main.
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: web
        env:
          VITE_DEMO: 'true'
      - name: Publish to gh-pages
        working-directory: web/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
